name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API token stored anywhere.
# One-time setup on pypi.org: Account -> Publishing -> add a pending publisher:
#   project: stitch-lineage, owner: sverrbear, repo: stitch-lineage,
#   workflow: publish.yml, environment: pypi
# Then publishing = create a GitHub release (tag v0.1.0 etc.) and this runs.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "release tag '${GITHUB_REF_NAME}' does not match pyproject version 'v${version}'" >&2
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stitch-lineage
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
