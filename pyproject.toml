[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stitch-lineage"
version = "0.3.2"
description = "dbt <-> Metabase column lineage and interactive ERD"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sverrir", email = "sverrir@smitten.fun" }]
keywords = [
    "dbt",
    "metabase",
    "lineage",
    "column-lineage",
    "erd",
    "data-catalog",
    "analytics-engineering",
]
# No "License :: OSI Approved :: ..." classifier here, deliberately: `license = "MIT"` emits a
# PEP 639 License-Expression, and PyPI rejects any upload carrying both. The license still
# shows on the project page -- it comes from the expression now, not from a classifier.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "requests>=2.31",
    "ruamel.yaml>=0.18",
    # 25.26 is the floor for qualify(allow_partial_qualification=...) -- what lets a native
    # card whose SQL outran the Metabase metadata sync resolve partly instead of not at all
    # (resolve/native_sql.py)
    "sqlglot>=25.26",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "import-linter>=2",
    "ruff>=0.5",
    "responses>=0.25",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/sverrbear/stitch-lineage"
Documentation = "https://github.com/sverrbear/stitch-lineage#readme"
Repository = "https://github.com/sverrbear/stitch-lineage"
Issues = "https://github.com/sverrbear/stitch-lineage/issues"
Changelog = "https://github.com/sverrbear/stitch-lineage/releases"

[project.scripts]
stitch = "stitch_lineage.cli:app"

[tool.hatch.build]
# the built SPA is gitignored, and hatchling drops VCS-ignored files unless they are
# declared as artifacts -- without this the wheel ships a `serve` with no UI
artifacts = ["stitch_lineage/app/frontend/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["stitch_lineage"]
artifacts = ["stitch_lineage/app/frontend/dist/**"]
exclude = [
    "stitch_lineage/app/frontend/.gitignore",
    "stitch_lineage/app/frontend/src",
    "stitch_lineage/app/frontend/scripts",
    "stitch_lineage/app/frontend/dev-public",
    "stitch_lineage/app/frontend/node_modules",
    "stitch_lineage/app/frontend/index.html",
    "stitch_lineage/app/frontend/package.json",
    "stitch_lineage/app/frontend/package-lock.json",
    "stitch_lineage/app/frontend/tsconfig.json",
    "stitch_lineage/app/frontend/*.config.ts",
    "stitch_lineage/app/frontend/README.md",
]

[tool.hatch.build.targets.sdist]
# `python -m build` builds the wheel from the sdist, so dist/ must survive both steps
artifacts = ["stitch_lineage/app/frontend/dist/**"]
exclude = [
    "stitch_lineage/app/frontend/node_modules",
    "stitch_lineage/app/frontend/dev-public",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["stitch_lineage"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "resolve is pure: no HTTP, no stitch I/O, no filesystem"
type = "forbidden"
source_modules = ["stitch_lineage.resolve"]
forbidden_modules = [
    "requests",
    "stitch_lineage.io",
    "os",
    "io",
    "pathlib",
]

[[tool.importlinter.contracts]]
# SPEC.md section 4's HTTP seam. It read "only io/metabase_client.py" until `stitch mend`
# needed to post a Slack notice (issue #143); what the rule protects was never the file
# count, it is that HTTP lives at the edge behind a NAMED client so everything above it is
# testable with no network. Two clients, and no more without a spec change:
# io/metabase_client.py and io/slack_webhook.py.
name = "only io HTTP clients speak HTTP"
type = "forbidden"
# direct imports only: cli may import metabase_client (which imports requests),
# but no listed module may import requests itself
allow_indirect_imports = true
source_modules = [
    "stitch_lineage.cli",
    "stitch_lineage.config",
    "stitch_lineage.init_wizard",
    "stitch_lineage.payloads",
    "stitch_lineage.apply",
    "stitch_lineage.graph",
    "stitch_lineage.export",
    "stitch_lineage.app",
    "stitch_lineage.mend",
    "stitch_lineage.io.artifacts",
    "stitch_lineage.io.dbt_runner",
    "stitch_lineage.io.git",
    "stitch_lineage.io.graph_store",
    "stitch_lineage.io.history_store",
    "stitch_lineage.io.mend_store",
    "stitch_lineage.io.staged_store",
    "stitch_lineage.write",
]
forbidden_modules = ["requests"]

[[tool.importlinter.contracts]]
# Deciding a repair must be possible offline, from graphs and raw payloads alone -- that is
# what lets the taxonomy, both MBQL rewrite shapes and the essentialness rule be unit-tested
# against synthetic cards instead of against a live BI estate. Only mend/apply.py, the loop
# that writes, may reach io/ -- and mend/apply.py is exactly where the guards live.
name = "mend planning is pure: only mend.apply reaches the API"
type = "forbidden"
source_modules = [
    "stitch_lineage.mend.models",
    "stitch_lineage.mend.plan",
    "stitch_lineage.mend.render",
    "stitch_lineage.mend.rewrite",
]
forbidden_modules = [
    "requests",
    "stitch_lineage.io",
    "stitch_lineage.write",
]

[[tool.importlinter.contracts]]
name = "graph depends only on schema, never on resolve or io"
type = "forbidden"
source_modules = ["stitch_lineage.graph"]
forbidden_modules = [
    "stitch_lineage.resolve",
    "stitch_lineage.io",
]

[[tool.importlinter.contracts]]
name = "app is a pure consumer of graph.json"
type = "forbidden"
source_modules = ["stitch_lineage.app"]
forbidden_modules = [
    "stitch_lineage.resolve",
    "stitch_lineage.io.metabase_client",
]

[[tool.importlinter.contracts]]
name = "only write/ touches model YAML, and only the apply engine drives it"
type = "forbidden"
# Every model-YAML mutation goes through `stitch_lineage.apply` -- the engine that carries the
# diff preview, the dirty-file guard, the store clearing and the graph patch (SPEC.md section
# 8.2). `stitch serve`'s apply endpoints call that engine (issue #72); no layer below may reach
# write/ itself. Direct imports only, because the app now legitimately reaches write/ THROUGH
# the engine and the static export imports the app package for its templates -- what keeps the
# export read-only is that it ships one HTML file with no API at all.
allow_indirect_imports = true
source_modules = [
    "stitch_lineage.app",
    "stitch_lineage.resolve",
    "stitch_lineage.graph",
    "stitch_lineage.export",
    "stitch_lineage.io",
]
forbidden_modules = ["stitch_lineage.write"]

[[tool.importlinter.contracts]]
name = "write depends on the staged store and config only"
type = "forbidden"
source_modules = ["stitch_lineage.write"]
forbidden_modules = [
    "stitch_lineage.resolve",
    "stitch_lineage.app",
    "stitch_lineage.graph",
    "stitch_lineage.io.artifacts",
    "stitch_lineage.io.dbt_runner",
    "stitch_lineage.io.graph_store",
    "stitch_lineage.io.metabase_client",
]
# graph/schema.py is the data contract every layer codes against, and it owns the
# endpoint hash the staged store and the suggestion engine must agree on. This one
# chain (write -> staged_store -> schema) is the contract, not graph analysis leaking
# into the writer; any other write -> graph import still fails.
ignore_imports = ["stitch_lineage.io.staged_store -> stitch_lineage.graph.schema"]
