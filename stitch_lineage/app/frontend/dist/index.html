    <!-- stitch's own mark: two cards joined by a stitched line. No vendor
      colours here -- the Snowflake/Metabase marks are for labelling THEIR
      objects, not for stitch's identity (#66). -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='11' height='14' rx='2.5' fill='%234459C8'/%3E%3Crect x='19' y='9' width='11' height='14' rx='2.5' fill='%237D8FF0'/%3E%3Cpath d='M13 16h6' stroke='%23888' stroke-width='2.5' stroke-dasharray='3 2'/%3E%3C/svg%3E"
    />
    <title>stitch lineage</title>
    <script>
      // Theme before first paint (no flash). Mirrors src/theme.ts.
      ;(function () {
        try {
          var t = localStorage.getItem('stitch-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>

        window.__STITCH_META__ = {"metabase_url": ..., "generated_at": ..., "schema_version": ...};
      When the globals are absent the app fetches api/graph and api/meta instead.
    -->
